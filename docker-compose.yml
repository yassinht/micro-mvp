services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: micro
      RABBITMQ_DEFAULT_PASS: micro_pass

  device-service:
    build: ./device-service/device-service
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://mongo:27017/micro_mvp
      RABBITMQ_URL: amqp://micro:micro_pass@rabbitmq:5672
      GQL_GATEWAY_URL: http://gql-gateway:4000/events
    depends_on:
      - mongo
      - rabbitmq

  user-service:
    build: ./user-service/user-service
    ports:
      - "3002:3002"
    depends_on:
      - mongo

  gql-gateway:
    build: ./gql-gateway
    ports:
      - "4000:4000"
    depends_on:
      - device-service
      - user-service

  angular:
    build: ./angular-dashboard/angular-dashboard
    ports:
      - "4200:80"
    depends_on:
      - gql-gateway

  python-sim:
    build: ./python-sim
    environment:
      RABBITMQ_URL: amqp://micro:micro_pass@rabbitmq:5672
    depends_on:
      - rabbitmq

volumes:
  mongo_data:
